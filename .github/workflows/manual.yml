name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: gradle build
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-helper
          path: build/libs/*.jar
